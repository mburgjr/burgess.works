<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The site is designed light only; this stops browsers auto-darkening it. -->
<meta name="color-scheme" content="only light">
<title>Michael Burgess</title>
<link rel="icon" href="images/favicon.svg?v=7" type="image/svg+xml">
<link rel="icon" href="images/favicon.png?v=7" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="style.css?v=42">
</head>
<body class="paintings-page">
<header class="site-header">
  <a href="index.html">Michael Burgess</a>
  <nav aria-label="Main">
    <a href="paintings.html" aria-current="page">Paintings</a>
    <a href="poems.html">Poems</a>
    <a href="guitar.html">Guitar</a>
  </nav>
</header>
<main>
  <section class="viewer" aria-label="Paintings">
    <div class="stage">
      <div class="frame"><a id="full"><img id="image" alt=""></a></div>
    </div>
    <div class="bar">
      <div class="item-tabs" id="item-tabs" role="group" aria-label="Paintings"></div>
      <div class="meta"><h2 id="title"></h2><span class="caption" id="caption"></span></div>
      <div class="actions">
        <!-- Pinned to the window sides on desktop; on phones they share this row with the buttons. -->
        <button type="button" class="side-arrow prev" id="prev" aria-label="Previous painting">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
        <a class="button" id="download" download>DOWNLOAD</a>
        <a class="button" id="buy">BUY PRINT</a>
        <button type="button" class="side-arrow next" id="next" aria-label="Next painting">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </section>
</main>
<script src="content.js?v=e09d87c1"></script>
<script src="viewer.js?v=5"></script>
<script>
// The file name a download is saved under, e.g. "harbour-at-dusk.jpg".
function downloadName(title, file) {
  var slug = title.toLowerCase().replace(/['\u2019]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return (slug || "download") + file.slice(file.lastIndexOf("."));
}
startViewer(CONTENT.paintings, function (painting) {
  // Each painting starts at the top, even after scrolling to the caption.
  window.scrollTo(0, 0);
  // Non-breaking spaces keep a size like "50 x 40 cm" together when the
  // caption wraps on a phone.
  var size = painting.size && String(painting.size).replace(/ /g, "\u00a0");
  var caption = ["Michael Burgess", painting.medium, size, painting.year]
    .filter(Boolean).join(", ");
  var image = document.getElementById("image");
  image.src = painting.file;
  // A tap opens the full image, where it can be zoomed.
  document.getElementById("full").href = painting.file;
  image.alt = painting.title + ", " + caption;
  document.getElementById("title").textContent = painting.title;
  document.getElementById("caption").textContent = caption;
  var download = document.getElementById("download");
  download.href = painting.file;
  download.setAttribute("download", downloadName(painting.title, painting.file));
  var buy = document.getElementById("buy");
  buy.hidden = painting.prints === false;
  buy.href = "mailto:mjburgessjr@gmail.com?subject=" +
    encodeURIComponent("Print enquiry: " + painting.title);
});
</script>
</body>
</html>
