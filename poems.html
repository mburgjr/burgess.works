<head>

<title>Michael Burgess</title>
<link rel="icon" href="images/favicon.svg?v=7" type="image/svg+xml">
<link rel="icon" href="images/favicon.png?v=7" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="poems-page">
<header class="site-header">
  <a href="index.html">Michael Burgess</a>
  <nav aria-label="Main">
    <a href="paintings.html">Paintings</a>
    <a href="poems.html" aria-current="page">Poems</a>
    <a href="guitar.html">Guitar</a>
  </nav>
</header>
<main>
  <article class="viewer" aria-label="Poems">
    <div class="bar">
      <div class="meta"><h2 id="title"></h2><p class="byline" id="byline"></p></div>
      <div class="item-tabs" id="item-tabs" role="group" aria-label="Poems"></div>
    </div>
    <div class="poem" id="poem"></div>
  </article>
  <button type="button" class="side-arrow prev" id="prev" aria-label="Previous poem">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </button>
  <button type="button" class="side-arrow next" id="next" aria-label="Next poem">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</main>
<script src="content.js?v=e09d87c1"></script>
<script src="viewer.js?v=5"></script>
<script>
startViewer(CONTENT.poems, function (poem) {
  document.getElementById("title").textContent = poem.title;
  document.getElementById("byline").textContent =
    ["Michael Burgess", poem.year].filter(Boolean).join(", ");
  var container = document.getElementById("poem");
  container.replaceChildren();
  poem.text.split("\n").forEach(function (text) {
    var line = document.createElement("span");
    line.className = "line";
    line.textContent = text;
    container.appendChild(line);
  });
  window.scrollTo(0, 0);
});
</script>
</body>
</html>
